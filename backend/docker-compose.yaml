services:
  nzbget:
    container_name: nzbget
    profiles: [nzbget]
    ports:
      - 6789:6789
    environment:
      - LC_ALL=C
      - PUID=${PUID}
      - PGID=${PGID}
      - HOME=/root
      - TERM=xterm
    volumes:
      - /etc/localtime:/etc/localtime
      - ${DOCKERPATH}/nzbget:/config
      - ${PROCESSPATH}:/mnt/processing
      - ${MEDIAPATH}:/mnt/Media
      - /tmp:/tmp
    networks:
      - internal
    restart: always
    image: linuxserver/nzbget:latest
    labels:
      - wud.watch=true
  sonarr:
    container_name: sonarr
    profiles: [sonarr]
    ports:
      - 8989:8989
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - HOME=/root
      - TERM=xterm
      - XDG_CONFIG_HOME=/config/xdg
      - LANGUAGE=en_US.UTF-8
      - LANG=en_US.UTF-8
    volumes:
      - /etc/localtime:/etc/localtime
      - ${DOCKERPATH}/sonarr:/config
      - ${MEDIAPATH}:/mnt/Media
      - ${PROCESSPATH}:/mnt/processing
    networks:
      - internal
    restart: always
    image: linuxserver/sonarr:latest
    labels:
      - wud.watch=true
  radarr:
    container_name: radarr
    profiles: [radarr]
    ports:
      - 7878:7878
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - HOME=/root
      - TERM=xterm
      - XDG_CONFIG_HOME=/config/xdg
      - LANGUAGE=en_US.UTF-8
      - LANG=en_US.UTF-8
    volumes:
      - /etc/localtime:/etc/localtime
      - ${DOCKERPATH}/radarr:/config
      - ${MEDIAPATH}:/mnt/Media
      - ${PROCESSPATH}:/mnt/processing
    networks:
      - internal
    restart: always
    image: linuxserver/radarr:latest
    labels:
      - wud.watch=true
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    profiles: [prowlarr]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKERPATH}/prowlarr:/config
    ports:
      - 9696:9696
    networks:
      - internal
    restart: always
    labels:
      - wud.watch=true
  tdarr:
    container_name: tdarr_server
    profiles: [tdarr]
    volumes:
      - ${DOCKERPATH}/tdarr/server:/app/server
      - ${DOCKERPATH}/tdarr/configs:/app/configs
      - ${DOCKERPATH}/tdarr/logs:/app/logs
      - ${MEDIAPATH}:/media
      - ${PROCESSPATH}:/temp
    environment:
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    ports:
      - 8265:8265
      - 8266:8266
    networks:
      - internal
    restart: always
    image: haveagitgat/tdarr
    labels:
      - wud.watch=true
  tdarr_node:
    container_name: tdarr_node
    profiles: [tdarr]
    volumes:
      - ${DOCKERPATH}/tdarr/configs:/app/configs
      - ${DOCKERPATH}/tdarr/logs:/app/logs
      - ${MEDIAPATH}:/media
      - ${PROCESSPATH}:/temp
    network_mode: service:tdarr
#    runtime: nvidia
    environment:
      - nodeID=Node01
      - serverIP=0.0.0.0
      - serverPort=8266
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
#      - NVIDIA_DRIVER_CAPABILITIES=all
#      - NVIDIA_VISIBLE_DEVICES=all
    devices:
      - /dev/dri:/dev/dri
    restart: always
    image: haveagitgat/tdarr_node
    labels:
      - wud.watch=true
  gluetun:
    container_name: gluetun
    profiles: [qbittorrentvpn]
    image: qmcgaw/gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8080:8080
    volumes:
      - ${DOCKERPATH}/gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=${GLUETUN_VPN_TYPE}
      - OPENVPN_CUSTOM_CONFIG=/gluetun/custom.conf
      - OPENVPN_USER=${OPENVPN_USER:-}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD:-}
      - FIREWALL_INPUT_PORTS=8080
    networks:
      - internal
    restart: unless-stopped
  qbittorrent:
    container_name: qbittorrent
    profiles: [qbittorrentvpn]
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: service:gluetun
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${DOCKERPATH}/qbittorrent:/config
      - ${MEDIAPATH}:/mnt/Media
      - ${PROCESSPATH}:/mnt/processing
    restart: unless-stopped
    labels:
      - wud.watch=true
  transmission-openvpn:
    container_name: transmission-w-vpn
    profiles: [transmission]
    cap_add:
      - NET_ADMIN
    volumes:
      - ${DOCKERPATH}/processing:/data
    environment:
      - OPENVPN_PROVIDER=PIA
      - OPENVPN_CONFIG=us_denver
      - OPENVPN_USERNAME=${PIAUSER}
      - OPENVPN_PASSWORD=${PIAPASS}
      - LOCAL_NETWORK=${LOCALNET}
      - PUID=${PUID}
      - PGID=${PGID}
    networks:
      - internal
    ports:
      - 9091:9091
    image: haugene/transmission-openvpn
    labels:
      - wud.watch=true
networks:
  internal:
    external: true
