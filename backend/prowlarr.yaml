version: "2.1"
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKERPATH}/prowlarr:/config
    ports:
      - 9696:9696
    networks:
      - internal
    restart: always
networks:
  internal:
    external: true
