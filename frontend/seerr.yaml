version: '3.3'
services:
    seerr:
        container_name: seerr
        environment:
            - PUID=${PUID}
            - PGID=${PGID}
            - TZ=${TZ}
        ports:
            - 5055:5055
        volumes:
            - ${DOCKERPATH}/seerr/config:/app/config
        restart: unless-stopped
        image: ghcr.io/seerr-team/seerr:latest
networks:
  internal:
    external: true
