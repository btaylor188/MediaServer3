version: '3.3'
services:
    seerr:
        container_name: seerr
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=America/Denver
        ports:
            - 5055:5055
        volumes:
            - $DOCKERPATH/seerr/config:/config
        restart: unless-stopped
        image: ghcr.io/seerr-team/seerr:latest
networks:
  internal:
    external: true
