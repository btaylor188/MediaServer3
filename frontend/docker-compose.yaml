services:
  pms-docker:
    container_name: plex
    profiles: [plex]
    devices:
      - /dev/dri:/dev/dri
#    runtime: nvidia
    ports:
      - 32400:32400/tcp
      - 3005:3005/tcp
      - 8324:8324/tcp
      - 32469:32469/tcp
      - 1900:1900/udp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    environment:
      - TZ=${TZ}
#      - NVIDIA_VISIBLE_DEVICES=all
#      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - PLEX_CLAIM=${PLEXCLAIM}
    networks:
      - internal
      - external
    volumes:
      - ${DOCKERPATH}/plex/database:/config
      - /dev/shm:/transcode
      - ${MEDIAPATH}:/mnt/unionfs/Media
    restart: always
    image: plexinc/pms-docker
    labels:
      - com.centurylinklabs.watchtower.enable=true
  overseerr:
    container_name: overseerr
    profiles: [overseerr]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 5055:5055
    volumes:
      - ${DOCKERPATH}/overseerr/config:/config
    networks:
      - internal
    restart: unless-stopped
    image: linuxserver/overseerr
    labels:
      - com.centurylinklabs.watchtower.enable=true
  speedtest:
    container_name: speedtest
    profiles: [speedtest]
    ports:
      - 8223:8223
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TITLE=${DOMAINNAME}
      - WEBPORT=8223
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
    restart: always
    image: adolfintel/speedtest
    labels:
      - com.centurylinklabs.watchtower.enable=true
networks:
  internal:
    external: true
  external:
    external: true
